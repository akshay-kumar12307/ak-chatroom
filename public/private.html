<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Private Room</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

<header class="chat-header">
  <button id="exitBtn" class="icon-btn">←</button>
  <div class="room-title" id="roomTitle">Private Room</div>
  <button id="menuBtn" class="icon-btn">☰</button>
</header>

<div id="members" class="members hidden"></div>

<main id="messages" class="messages"></main>

<div id="voicePreview" class="voice-preview hidden">
  <audio id="voiceAudio" controls></audio>
  <button id="sendVoiceBtn" class="send-btn">Send</button>
  <button id="cancelVoiceBtn" class="icon-btn">✖</button>
</div>

<div id="typingIndicator" class="typing-indicator hidden"></div>
<!-- Upload progress bar -->
<div id="uploadProgress" class="upload-progress hidden">
  <div id="uploadBar"></div>
</div>


<footer class="chat-input">
  <button id="fileBtn" class="icon-btn">📎</button>
  <button id="voiceBtn" class="icon-btn">🎤</button>

  <input
    id="msgInput"
    type="text"
    placeholder="Type a message…"
    autocomplete="off"
  />

  <button id="sendBtn" class="send-btn">➤</button>
</footer>

<input type="file" id="fileInput" hidden />

<script src="/socket.io/socket.io.js"></script>
<script src="js/private.js"></script>
</body>
</html>
